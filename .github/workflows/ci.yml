name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRANSFORMERS_NO_TF: "1"
      TRANSFORMERS_NO_FLAX: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CPU CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Import-check package
        run: |
          python -c "from email_subject_generator import clean_subject, naive_subject, pack_method_metrics; print(clean_subject('Q3 budget review meeting', fallback='Q3 budget review'))"

      - name: Pytest (mocked generator, no GPU)
        run: python -m pytest -q --disable-warnings

      - name: Benchmark smoke (naive only, 5 AESLC rows)
        run: python scripts/run_benchmark.py --samples 5 --seed 42 --skip-model --output-dir outputs/smoke
